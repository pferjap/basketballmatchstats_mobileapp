# Code-generation configuration.
#
# The installed SDK (Dart 3.13) is newer than the analyzer/freezed toolchain
# that the current dependency constraints resolve to, so two incompatibilities
# bite any code-generated output that touches Flutter or freezed:
#   * analyzer 7.6.0 cannot serialize the SDK's dot-shorthand AST, crashing
#     build_runner on any builder that resolves a Flutter-importing library.
#   * freezed 2.5.x emits `final` on redirecting-factory parameters, which the
#     Dart 3.13 front end rejects at compile time.
# Mitigation: only Drift codegen runs, scoped to the platform-agnostic database
# library + DAOs (no Flutter in their resolved closure). Freezed,
# json_serializable, and riverpod_generator are disabled — the data-layer DTOs
# and Riverpod providers are hand-written plain Dart instead. Re-enable once the
# codegen toolchain supports the installed SDK.
targets:
  $default:
    builders:
      drift_dev:drift_dev:
        generate_for:
          - lib/core/database/app_database.dart
          - lib/core/database/daos/**
      source_gen:combining_builder:
        generate_for:
          - lib/core/database/app_database.dart
          - lib/core/database/daos/**
      freezed:freezed:
        enabled: false
      json_serializable:json_serializable:
        enabled: false
      riverpod_generator:riverpod_generator:
        enabled: false
