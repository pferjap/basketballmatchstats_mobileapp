org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation.
#
# The Kotlin build-tools-api uses a "relocatable" incremental cache that stores
# source paths relative to the module root. When the pub cache (plugin Kotlin
# sources, e.g. package_info_plus) lives on a different Windows drive (C:) than
# the project (D:), Kotlin's relativeTo() throws
# "this and base files have different roots", which crashes plugin compilation
# with "Could not close incremental caches". Disabling IC avoids that cache
# entirely; plugin sources rarely change, so the build-time cost is negligible.
kotlin.incremental=false

